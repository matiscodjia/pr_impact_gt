# ============================================================================
# experiment_config.yaml -- configuration of the study
#
# Read by pipeline/orchestrator.py, pipeline/collect_metrics.py, the nnU-Net trainers
# (nnunet_trainers/, from the repository root) and the cluster config generators.
# ============================================================================

# Source dataset (clean reference GT*)
dataset:
  id: 100
  name: "Dataset100_PARSE"

# nnU-Net training
training:
  configurations: ["3d_fullres"]
  folds: [0, 1, 2, 3, 4]
  # 500 epochs: convergence point found in earlier work on pulmonary arteries. Read by
  # every trainer (nnUNetTrainerStd, nnUNetTrainerDegraded and subclasses). Can be
  # re-checked with pipeline/calibrate_epochs.py.
  num_epochs: 500

# Models (read by pipeline/orchestrator.py)
# A model = (nnU-Net trainer, source dataset). tier = execution priority (A before B).
# Within a tier the orchestrator interleaves the folds, so that a complete comparison
# exists as early as possible and is then refined.
experiment:
  models:
    # Clean baseline (Q1, Q2, Q3)
    - name: M0_Star
      trainer: nnUNetTrainerStd
      dataset_id: 100
      tier: A
    # Q1/Q2: biased topological noise (omission), on the fly
    - name: M1_Omission
      trainer: nnUNetTrainerDegradedOmissionOnly
      dataset_id: 100
      tier: A
    # Q2: UNBIASED boundary noise (drift mu = 0), on the fly = augmentation
    - name: M2_Drift_mu0
      trainer: nnUNetTrainerDriftMu0
      dataset_id: 100
      tier: A
    # Q3: learned boundary bias (drift mu < 0), FROZEN training labels (Dataset103)
    - name: M3_Drift_muMinus
      trainer: nnUNetTrainerStd
      dataset_id: 103
      tier: B
    # Q3: learned boundary bias (drift mu > 0), FROZEN training labels (Dataset104)
    - name: M4_Drift_muPlus
      trainer: nnUNetTrainerStd
      dataset_id: 104
      tier: B

# Noise operator N(GT*; theta), theta = (family, r, p[, mu]) -- see prgt/noise.py.
#
# Every image is ALWAYS degraded: p is a SEVERITY (fraction or proportion affected), never
# the probability of degrading an image. distal_omission and distal_truncation remove at
# least one structure whenever thin structures exist; boundary_drift and
# homogeneous_morpho always affect a fraction p of the surface when p > 0.
#
# Operating points MEASURED on PARSE (pipeline/calibrate_noise.py, then on all 85 cases
# with analysis/calibration_85.py), aiming at the inter-observer window [0.85, 0.90]:
#   distal_omission  r2 p0.3 -> clDice 0.878   (topological axis, biased)
#   boundary_drift   r1 p0.5 -> NSD@0.5 0.88   (surface axis; mu sets the bias)
#   distal_truncation: set aside -- redundant with distal_omission (same axis: biased
#                      reduction of the distal foreground).

# FROZEN degraded training sets (Q3: one consistent bias per case, like one annotator
# cohort). One realisation per case (fixed seed), so the target is stable and learnable.
# cluster/prepare_q3.sh builds them by copying the evaluation references GT- (same seeds);
# pipeline/make_fixed_training_sets.py rebuilds them from this block.
fixed_datasets:
  103:
    name: "Dataset103_PARSE_DriftMuMinus"
    degradations:
      # under-segmenting boundary bias (mu < 0)
      - family: boundary_drift
        r: 1
        p: 0.5
        mu: -0.5
  104:
    name: "Dataset104_PARSE_DriftMuPlus"
    degradations:
      # over-segmenting boundary bias (mu > 0)
      - family: boundary_drift
        r: 1
        p: 0.5
        mu: 0.5

# On-the-fly noise of the generic nnUNetTrainerDegraded (fallback only: the models above
# use dedicated trainers). One family, no compound noise.
stochastic_degradations:
  - family: distal_omission
    r: 2
    p: 0.3

# Schedule calibration (choice of num_epochs): ONE long run on one fold with checkpoint
# snapshots at the milestones; each snapshot is scored out of fold on clDice and Betti-0
# (topology converges later than the region Dice). See pipeline/orchestrator.py --calibrate
# and pipeline/calibrate_epochs.py.
calibration:
  budget: 1000                                  # epochs of the calibration run
  milestones: [200, 300, 400, 500, 600, 800, 1000]
  trainer: nnUNetTrainerCalib                   # nnUNetTrainerCalibDegraded for a noisy model
  dataset_id: 100
  fold: 0
  plateau_tol: 0.01                             # plateau = clDice >= (1 - tol) * max

# Evaluation references (read by pipeline/make_eval_references.py and collect_metrics.py).
# One noise per scenario (no compound noise). Matched metric:
#   omission -> clDice / Betti-0; drift -> NSD@0.5 + volume_delta (signed, directional).
evaluation:
  scenarios:
    - name: "GT_star"
      description: "Clean reference (GT*)."
      degradation: null
    - name: "GT_minus_omission"
      description: >
        Topological GT- (distal_omission r2 p0.3 -> clDice 0.878). Q1: does it penalise a
        model trained on clean labels? Matched metric clDice / Betti-0.
      degradation:
        - family: distal_omission
          r: 2
          p: 0.3
    - name: "GT_minus_drift_neg"
      description: "GT- with an under-segmenting boundary bias (drift r1 p0.5 mu=-0.5). Q3 (mu<0)."
      degradation:
        - family: boundary_drift
          r: 1
          p: 0.5
          mu: -0.5
    - name: "GT_minus_drift_pos"
      description: "GT- with an over-segmenting boundary bias (drift r1 p0.5 mu=+0.5). Q3 (mu>0)."
      degradation:
        - family: boundary_drift
          r: 1
          p: 0.5
          mu: 0.5
